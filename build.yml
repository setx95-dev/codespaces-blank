name: Build HelloPlugin

on:
  push:
      branches: [main]
        workflow_dispatch:

        permissions:
          contents: read

          jobs:
            build:
                runs-on: ubuntu-latest
                    steps:
                          - uses: actions/checkout@v4

                                - uses: actions/setup-java@v4
                                        with:
                                                  distribution: temurin
                                                            java-version: "21"
                                                                      cache: maven

                                                                            - run: mvn -B clean package

                                                                                  - uses: actions/upload-artifact@v4
                                                                                          with:
                                                                                                    name: HelloPlugin
                                                                                                              path: target/HelloPlugin-1.0.0.jar
